name: Gate 58 Real SQL (Disposable PostgreSQL)

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: onexa-gate58-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-g58-manual-journal-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: disposable_only
          POSTGRES_USER: postgres
          POSTGRES_DB: onexa_gate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d onexa_gate_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 8
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: disposable_only
      PGDATABASE: onexa_gate_test
      PGOPTIONS: "-c client_min_messages=warning"
    steps:
      - name: Check out commit
        uses: actions/checkout@v4
      - name: Confirm clean disposable PostgreSQL
        run: |
          test "$(psql -X -v ON_ERROR_STOP=1 -Atc "SELECT current_database()")" = "onexa_gate_test"
          test "$(psql -X -v ON_ERROR_STOP=1 -Atc "SELECT count(*) FROM pg_class WHERE relname = 'onexa_tenants'")" = "0"
      - name: Install synthetic finance parents and two fake tenants
        run: psql -X -v ON_ERROR_STOP=1 -f scripts/sql-fixtures/native-g42-real-posting-parent.sql
      - name: Install disposable ONLY manual-journal B4 adapter
        run: psql -X -v ON_ERROR_STOP=1 -f scripts/sql-fixtures/gate58-disposable-b4-adapter.sql
      - name: Compile ACTUAL Gate 58 manual journal SQL
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/manual-packages/gate58_manual_journal_workflow.sql
      - name: Validate Gate 58 catalog permissions and schema
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/manual-packages/gate58_postcheck.sql
      - name: Exercise ACTUAL Gate 58 finance functions and cross-tenant isolation
        run: psql -X -v ON_ERROR_STOP=1 -f scripts/sql-fixtures/gate58-real-manual-journal-smoke.sql
      - name: Exercise ACTUAL Gate 58 amendment RPC with preserved revision audit
        run: psql -X -v ON_ERROR_STOP=1 -f scripts/sql-fixtures/gate58-amendment-smoke.sql

