            supabase/manual-packages/gate73_onexa_native_operations_work_orders.sql \
            supabase/manual-packages/gate74_native_maintenance_posted_cost_attribution.sql \
            supabase/manual-packages/gate75_native_maintenance_unpaid_source_review.sql; do
            psql -X -v ON_ERROR_STOP=1 -f "$gate"
          done
